<script>(function(){try{if(localStorage.getItem('stories-theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
<style>
:root{--green:#156644;--green-dark:#0e4a31;--ink:#212420;--ink-soft:#565f5a;--muted:#8b938f;
  --paper:#faf9f6;--card:#ffffff;--line:#e6e3da;--red:#a1443b;--red-bg:#f8ece9;--focus:#156644;}
:root[data-theme="dark"]{color-scheme:dark;--green-dark:#86d3a9;--ink:#e6ebe8;--ink-soft:#b4bdb7;
  --muted:#8c968f;--paper:#111513;--card:#1a1f1c;--line:#2f3732;--red:#e39a90;--red-bg:#2e1c19;--focus:#86d3a9;}
*{box-sizing:border-box;}
html,body{margin:0;min-height:100%;}
body{background:var(--paper);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:24px 16px;}
.lk{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:36px 32px 30px;
  box-shadow:0 10px 40px rgba(0,0,0,.06);}
.lk-mark{display:block;height:56px;width:auto;margin:0 0 18px;}
.lk h1{font-family:'Oswald',Impact,'Arial Narrow',sans-serif;font-weight:600;letter-spacing:.01em;font-size:26px;line-height:1.15;
  margin:0 0 6px;text-transform:uppercase;}
.lk h1 span{color:var(--green-dark);}
.lk p{margin:0 0 22px;color:var(--ink-soft);font-size:15px;}
.lk label.f{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin:0 0 6px;}
.lk input[type=password]{width:100%;font:inherit;font-size:17px;padding:11px 13px;border:1px solid var(--line);border-radius:8px;
  background:var(--paper);color:var(--ink);}
.lk input[type=password]:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:transparent;}
.lk .rem{display:flex;align-items:center;gap:8px;margin:14px 0 20px;font-size:14px;color:var(--ink-soft);cursor:pointer;}
.lk .rem input{width:16px;height:16px;accent-color:var(--green);margin:0;}
.lk button{width:100%;font:inherit;font-weight:600;font-size:16px;padding:12px;border:0;border-radius:8px;background:var(--green);
  color:#fff;cursor:pointer;}
.lk button:hover{background:#0e4a31;}
.lk button:disabled{opacity:.7;cursor:progress;}
.lk button:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
.lk .lk-msg{min-height:22px;margin:12px 0 0;font-size:14px;color:var(--red);}

var KEY='stories-brief-key';
var form=document.getElementById('lk-form'),pw=document.getElementById('lk-pw'),rem=document.getElementById('lk-rem'),
    msg=document.getElementById('lk-msg'),btn=document.getElementById('lk-btn');
function bytes(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++){u[i]=b.charCodeAt(i);}return u;}
function hex(u){var s='';for(var i=0;i<u.length;i++){s+=('0'+u[i].toString(16)).slice(-2);}return s;}
function unhex(h){var u=new Uint8Array(h.length/2);for(var i=0;i<u.length;i++){u[i]=parseInt(h.substr(i*2,2),16);}return u;}
function derive(p){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits'])
    .then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:bytes(D.salt),iterations:D.iter},k,256);})
    .then(function(b){return new Uint8Array(b);});
}
function open(raw){
  return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt'])
    .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(D.iv)},k,bytes(D.ct));})
    .then(function(p){return new Response(new Blob([p]).stream().pipeThrough(new DecompressionStream('gzip'))).text();});
}
function show(html){D=null;document.open();document.write(html);document.close();}
function stored(){try{return localStorage.getItem(KEY);}catch(e){return null;}}
function remember(raw){try{if(rem.checked){localStorage.setItem(KEY,hex(raw));}else{localStorage.removeItem(KEY);}}catch(e){}}
function forget(){try{localStorage.removeItem(KEY);}catch(e){}}
if(!(window.crypto&&crypto.subtle&&window.DecompressionStream)){
  msg.textContent='This browser cannot open the brief. Please use a current Chrome, Edge, Safari or Firefox.';
  btn.disabled=true;return;
}
form.addEventListener('submit',function(ev){
  ev.preventDefault();
  if(!pw.value){msg.textContent='Enter the password.';pw.focus();return;}
  btn.disabled=true;btn.textContent='Opening…';msg.textContent='';
  var raw;
  derive(pw.value).then(function(r){raw=r;return open(r);}).then(function(html){remember(raw);show(html);},function(){
    btn.disabled=false;btn.textContent='Open';msg.textContent='Incorrect password. Please try again.';pw.select();
  });
});
var saved=stored();
if(saved&&/^[0-9a-f]{64}$/.test(saved)){
  document.body.classList.add('lk-auto');
  open(unhex(saved)).then(show,function(){forget();document.body.classList.remove('lk-auto');pw.focus();});
}else{pw.focus();}
})();</script>
